name: Bug triage

# Runs the triage-bug skill (.claude/skills/triage-bug/SKILL.md) on bug reports: check the report has enough
# information, check for duplicates, reproduce it against a throwaway copy of the app with the Playwright MCP,
# comment the findings and open a fix PR when confident.
#
# Triggers:
#   - A bug issue is opened (the bug report template adds the `bug` label) or the `bug` label is added later.
#   - The author replies to an issue triage marked `needs-info`, so the triage runs again with the new details.
#   - Manually, from the Actions tab, for any issue number (e.g. to re-run after a fix to this workflow).
#
# Only issues and comments from the repo's owner, members and collaborators trigger it automatically, because
# the issue text is fed to an agent that can push branches. For a report from anyone else, a maintainer can
# run it manually or re-add the `bug` label (the action also requires the triggering user to have write access).

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: number

# One triage per issue at a time. A queued run's gate sees the earlier run's comment and skips.
concurrency:
  group: bug-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  gate:
    # Cheap filters first, so ordinary comments on issues and PRs don't start a runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
        contains(github.event.issue.labels.*.name, 'bug') &&
        (github.event.action == 'opened' || github.event.label.name == 'bug') &&
        (github.event.action == 'labeled' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))) ||
      (github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        contains(github.event.issue.labels.*.name, 'bug') &&
        contains(github.event.issue.labels.*.name, 'needs-info') &&
        github.event.comment.user.login == github.event.issue.user.login &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    outputs:
      run: ${{ steps.check.outputs.run }}
      issue: ${{ steps.check.outputs.issue }}
    steps:
      # Opening an issue from the template fires both `opened` and `labeled`; the second run queues behind the
      # first (see concurrency) and stops here once the first has commented. Author replies and manual runs
      # always go through.
      - name: Skip issues that have already been triaged
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "issues" ] && \
             gh issue view "$ISSUE" --repo "${{ github.repository }}" --json comments \
               -q '.comments[].body' | grep -q '<!-- bug-triage -->'; then
            echo "Issue #$ISSUE has already been triaged; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  triage:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # the Claude GitHub app authenticates via OIDC

    # Same throwaway Postgres as the E2E job in docker-publish.yml.
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      PGPASSWORD: postgres

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # Same version as the devcontainer; the linux-x64 bundle ships its own JRE
    - name: Install Flyway
      run: |
        curl -fsSL "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/9.22.3/flyway-commandline-9.22.3-linux-x64.tar.gz" \
          | sudo tar -xz -C /opt
        echo "/opt/flyway-9.22.3" >> "$GITHUB_PATH"

    - name: Install frontend dependencies
      working-directory: ./poolleaderboard.client
      run: npm ci

    - name: Install E2E dependencies
      working-directory: ./e2e
      run: |
        npm ci
        npx playwright install --with-deps chromium

    # Same version as the devcontainer, so .mcp.json (`playwright-mcp --headless --no-sandbox`) works unchanged.
    - name: Install Playwright MCP
      run: |
        npm install -g @playwright/mcp@0.0.83
        cd "$(npm root -g)/@playwright/mcp" && npx --no-install playwright-core install --with-deps chromium

    - name: Start the E2E app on :5180
      working-directory: ./e2e
      run: |
        nohup ./scripts/start-server.sh > "$RUNNER_TEMP/e2e-server.log" 2>&1 &
        for i in $(seq 1 150); do
          if curl -s -o /dev/null -w '%{http_code}' http://localhost:5180/ | grep -q 200; then
            echo "E2E app is up"; break
          fi
          sleep 2
        done
        curl -sf -o /dev/null http://localhost:5180/ || { tail -50 "$RUNNER_TEMP/e2e-server.log"; exit 1; }
        psql -h localhost -U postgres -d leaderboard_e2e -q -f seed.sql

    - name: Ensure triage labels exist
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh label create needs-info   --color D93F0B --description "Bug triage needs more detail from the author" --force
        gh label create investigated --color 0E8A16 --description "Bug triage has reproduced and investigated this" --force
        gh label create fix-proposed --color 1D76DB --description "Bug triage has opened a PR to fix this" --force

    - name: Triage the bug
      uses: anthropics/claude-code-action@v1
      with:
        prompt: /triage-bug ${{ needs.gate.outputs.issue }}${{ github.event_name == 'workflow_dispatch' && ' --rerun' || '' }}
        # Whichever secret /install-github-app created; the other is empty.
        anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        claude_args: |
          --mcp-config .mcp.json
          --max-turns 200
          --allowedTools "Read,Edit,Write,Glob,Grep,mcp__playwright,Bash(gh:*),Bash(git:*),Bash(dotnet:*),Bash(npm:*),Bash(npx:*),Bash(curl:*),Bash(psql:*),Bash(./e2e/scripts/start-server.sh:*),Bash(./scripts/start-server.sh:*),Bash(nohup:*),Bash(cd:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(sed:*),Bash(sleep:*),Bash(top:*),Bash(ps:*),Bash(pgrep:*),Bash(pkill:*),Bash(kill:*)"

    - name: Upload server log and browser artefacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: bug-triage-${{ needs.gate.outputs.issue }}
        path: |
          ${{ runner.temp }}/e2e-server.log
          .playwright-mcp/
        if-no-files-found: ignore
        retention-days: 14
